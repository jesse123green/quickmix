<!doctype html>
<html>
  <head>
    <title>Your QuickMix Playlist</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="//netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css">
    <link href='https://fonts.googleapis.com/css?family=PT+Serif:400,700' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600,700,900' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="../static/css/playlist.css">
    <link rel="apple-touch-icon" sizes="57x57" href="{{ url_for('static', filename='img/icons/apple-icon-57x57.png')}}">
    <link rel="apple-touch-icon" sizes="60x60" href="{{ url_for('static', filename='img/icons/apple-icon-60x60.png')}}">
    <link rel="apple-touch-icon" sizes="72x72" href="{{ url_for('static', filename='img/icons/apple-icon-72x72.png')}}">
    <link rel="apple-touch-icon" sizes="76x76" href="{{ url_for('static', filename='img/icons/apple-icon-76x76.png')}}">
    <link rel="apple-touch-icon" sizes="114x114" href="{{ url_for('static', filename='img/icons/apple-icon-114x114.png')}}">
    <link rel="apple-touch-icon" sizes="120x120" href="{{ url_for('static', filename='img/icons/apple-icon-120x120.png')}}">
    <link rel="apple-touch-icon" sizes="144x144" href="{{ url_for('static', filename='img/icons/apple-icon-144x144.png')}}">
    <link rel="apple-touch-icon" sizes="152x152" href="{{ url_for('static', filename='img/icons/apple-icon-152x152.png')}}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/icons/apple-icon-180x180.png')}}">
    <link rel="icon" type="image/png" sizes="192x192"  href="{{ url_for('static', filename='img/icons/android-icon-192x192.png')}}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/icons/android-icon-32x32.png')}}">
    <link rel="icon" type="image/png" sizes="96x96" href="{{ url_for('static', filename='img/icons/android-icon-96x96.png')}}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/icons/android-icon-16x16.png')}}">
    <link rel="manifest" href="{{ url_for('static', filename='img/icons/manifest.json')}}">
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');

      ga('create', 'UA-80235348-1', 'auto');
      ga('send', 'pageview');

    </script>
  </head>

  <body class="tune tune-{{type}}">

    <!-- The overlay -->
    <div id="spotifyOverlay" class="overlay">

      <!-- Overlay content -->
      <div class="overlay-content">
        <img class="spotify-logo" src="{{ url_for('static', filename='img/Spotify_Icon_RGB_Green.png')}}">
        <h1 id="spotifyOverlayText"></h1>
      </div>

    </div>

    <!-- Export overlay -->
    <div id="exportOverlay" class="overlay">

      <!-- Overlay content -->
      <div class="overlay-content">
        <img class="spotify-logo" src="{{ url_for('static', filename='img/Spotify_Icon_RGB_Green.png')}}">
        <h1 id="export-playlist-text">Exporting playlist…</h1>
      </div>

    </div>

    <div class="hat">
      <div class="container">
        <div class="row">
          <div class="col-xs-12 col-sm-12 col-md-12">
            <h1 class="pl-title">Here’s your playlist</h1>
          </div>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="row options">
        <div class="col-xs-12 col-sm-6">
          <div class="playlist-desc">
            <h3>Your <i>{{type}}</i> playlist has <span id="playlist-meta">26 songs and is 1 hour and 28 minutes</span> long.</h3>
          </div>
        </div>
        <div class="col-xs-12 col-sm-6 export-header">
          <button class="export-button">Add Playlist to Spotify</button>
        </div>
      </div>

      <div class="row options">
        <div class="col-x-12">
          <div class="song-info-loading"><img src="../static/img/spinner-{{type}}.gif" width="60" height="60"/></div>
          <div class="influencers hidden">
            <div class="song-info {{ type }}">

              <div data-bind="foreach: songs">
                <div class= "song-container">
                  <div class="coverart" data-bind="style: { backgroundImage: 'url(\'' + coverart + '\')' }">
                  </div>
                  <div class="song-preview-area" data-bind="click: $root.playSong">
                      <table class="song-text">
                        <tr>
                          <td>
                            <h6 data-bind="text: title"></h6>
                          </td>
                        </tr>
                        <tr>
                          <td>
                            <h5 data-bind="text: artist"></h5>
                          </tr>
                        </td>
                        <tr>
                          <td>
                            <div class="preview" data-bind="css: { {{ type }}: isPlaying()}"><div class='arrow-right' data-bind="css: { {{ type }}: isPlaying()}"></div>Play Preview</div>
                          </tr>
                        </td>
                      </table>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>


      <div class="row submit">
        <div class="col-xs-12">
          <div class="button-wrapper">
            <button class="btn btn-default submit-button {{ type }}" id="export-bottom">Add Playlist to Spotify</button>
            <div class="start-over-wrapper">
              <a class="start-over link-shadow underline-link .underline-link {{type}}" href="/">Or create a new playlist</a>
            </div>
          </div>
        </div>
      </div>

      <hr/>

      <div class="row footer">
        <div class="col-xs-12">
          <div class="footer-text text-right">
            Song previews provided by Spotify
            <img height="24px" width="24px" class="spotify-logo" src="{{ url_for('static', filename='img/Spotify_Icon_RGB_Green.png')}}">
          </div>
        </div>
      </div>

    </div>



    <script src="http://code.jquery.com/jquery-1.10.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.4.0/knockout-min.js"></script>
    <script src="../static/js/playlist.js"></script>
  </body>
</html>
